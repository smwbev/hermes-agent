name: PR109015 non-container candidate verification
on:
  push:
    branches: [ci-verify/pr109015/foreground-20260927]
permissions:
  contents: read
concurrency:
  group: pr109015-noncontainer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  targeted:
    if: github.repository == 'smwbev/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout reviewed CI-only wrapper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          path: wrapper
      - name: Checkout exact unmodified candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: smwbev/hermes-agent
          ref: 33f3fc1eed9938ddd29dea1d1f49eb480a96fd9c
          persist-credentials: false
          path: candidate
          fetch-depth: 0
      - name: Install pinned uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.12.13'
          enable-cache: false
      - name: Verify all retained obligations on exact candidate VM
        working-directory: candidate
        run: python3 -B ../wrapper/.github/scripts/pr109015_foreground.py
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr109015-33f3fc1eed-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/verification-evidence/
          if-no-files-found: warn
          retention-days: 30
